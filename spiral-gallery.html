<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Gallery</title>
<!-- Spiral Gallery: images on a rotating 3D helix that climbs as it turns; drag / wheel with inertia.
     Needs only GSAP 3.13.0 core (no plugins). -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous"></script>
<script>
/* ---- shared helpers (identical in all four files) ---- */
const KIT = {
  /* seeded placeholder photo: same seed, same picture. Swap for real assets. */
  img: (seed, w = 800, h = 1000) => `https://picsum.photos/seed/gallery${seed}/${w}/${h}`,
  words: ['Atlas', 'Meridian', 'Halcyon', 'Cobalt', 'Saffron', 'Verdant', 'Obsidian', 'Lumen', 'Ember', 'Solace', 'Tidal', 'Ochre'],
  rand: (a, b) => a + Math.random() * (b - a),
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  $: (s, r = document) => r.querySelector(s),
  $$: (s, r = document) => [...r.querySelectorAll(s)],
};
</script>
<style>
  /* ---- shared base (identical in all four files) ---- */
  :root {
    --bg: #0d0d0f; --bg2: #16161a; --line: #2c2c33;
    --fg: #f3f1ec; --dim: #8a8a93;
    --ease: cubic-bezier(.65,0,.35,1);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  .eyebrow { font: 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .h2 { font-size: clamp(32px, 5.5vw, 76px); font-weight: 600; letter-spacing: -.035em; line-height: 1; margin: 0; }
  .hint { font: 12px/1.4 var(--mono); color: var(--dim); letter-spacing: .06em; }
  .round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 18px; }
  .round:hover { background: var(--bg2); }

  /* ---- component ---- */
  body { overflow: hidden; }
  .sg-scene { position: fixed; inset: 0; perspective: 1100px; cursor: grab; touch-action: none; }
  .helix { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .sg-image { position: absolute; width: 170px; height: 120px; margin: -60px 0 0 -85px; border-radius: 8px; overflow: hidden; backface-visibility: visible; }
  .sg-image img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .label { position: fixed; left: 40px; bottom: 40px; z-index: 5; }
</style>
</head>
<body>
<div class="sg-scene"><div class="helix"></div></div>
<div class="label"><p class="eyebrow">Spiral gallery</p><h1 class="h2">A helix of images</h1><p class="hint">drag / scroll to rotate · inertia</p></div>
<script>
const CFG = { count: 36, turns: 3, radius: 360, height: 1500, inertiaDecay: .95, inertiaMax: 4, autoplay: .12 };
const helix = KIT.$('.helix');
helix.innerHTML = Array.from({ length: CFG.count }, (_, i) => `<div class="sg-image"><img src="${KIT.img(2600 + i, 340, 240)}" alt=""></div>`).join('');
const imgs = KIT.$$('.sg-image');
// each image sits on a helix: angle advances with index, y climbs linearly; faces outward
imgs.forEach((el, i) => {
  const t = i / CFG.count, a = t * CFG.turns * 360;
  el.style.transform = `rotateY(${a}deg) translateZ(${CFG.radius}px) translateY(${(t - .5) * CFG.height}px)`;
});
let rot = 0, vel = CFG.autoplay, dragging = false, lx = 0;
gsap.ticker.add(() => {
  if (!dragging) { vel = KIT.lerp(vel, CFG.autoplay, 1 - CFG.inertiaDecay); }
  rot += vel;
  // climb: the helix scrolls vertically in step with rotation so it reads as an endless spiral
  const climb = (rot / (CFG.turns * 360)) * CFG.height;
  helix.style.transform = `translateY(${gsap.utils.wrap(-CFG.height / 2, CFG.height / 2, climb) * .35}px) rotateX(-8deg) rotateY(${-rot}deg)`;
  imgs.forEach((el, i) => {
    const a = (i / CFG.count) * CFG.turns * 360 - rot, facing = Math.cos(a * Math.PI / 180);
    el.style.opacity = .25 + .75 * Math.max(0, facing);
  });
});
const scene = KIT.$('.sg-scene');
scene.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; scene.setPointerCapture(e.pointerId); });
scene.addEventListener('pointermove', e => { if (!dragging) return; vel = KIT.clamp((e.clientX - lx) * -.25, -CFG.inertiaMax, CFG.inertiaMax); lx = e.clientX; });
scene.addEventListener('pointerup', () => dragging = false);
addEventListener('wheel', e => { vel = KIT.clamp(vel + e.deltaY * .01, -CFG.inertiaMax, CFG.inertiaMax); }, { passive: true });
gsap.from(scene, { opacity: 0, scale: .8, duration: 1.4, ease: 'expo.out' });
</script>
</body>
</html>
